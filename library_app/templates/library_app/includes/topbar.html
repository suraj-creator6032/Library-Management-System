<header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-border bg-white px-4 sm:px-6 lg:px-8">

    <!-- Left section -->
    <div class="flex items-center gap-4">

        <!-- Mobile sidebar toggle -->
        <button
            id="sidebar-toggle"
            type="button"
            class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 lg:hidden"
            aria-label="Open navigation"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                />
            </svg>
        </button>

        <!-- Page heading -->
        <div>
            <h2 class="text-lg font-semibold text-slate-900">
                {{ page_title|default:"Dashboard" }}
            </h2>

            <p class="hidden text-xs text-slate-500 sm:block">
                Library Management System
            </p>
        </div>

    </div>


    <!-- Right section -->
    <div class="flex items-center gap-3 sm:gap-4">

        <!-- User information -->
        <div class="hidden text-right sm:block">

            <p class="text-sm font-semibold text-slate-800">
                {{ request.user.username }}
            </p>

            <p class="text-xs text-slate-500">
                {% if request.user.is_superuser %}
                    Administrator
                {% else %}
                    Library Member
                {% endif %}
            </p>

        </div>


        <!-- User avatar -->
        <div
            class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold uppercase text-indigo-700"
            aria-label="User avatar"
        >
            {{ request.user.username|first|upper }}
        </div>

    </div>

</header>
